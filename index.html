<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset = "UTF-8">
        <meta name = "description" content = "Web Application for To Do">
        <title>web-todo</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <section class = "todolist">
            <h1>Track your To Do List!</h1>
            
            <form>
                <label for="todo">Task</label>
                <input type="text" id="todo" name="todo">
                <button id="addButton">Add to To-Do List</button>
            </form>
            <div class = list>
                <ul id="todo-list">

                </ul>
            </div>
            <button id="clearButton">Clear Completed</button>
        </section>

        <script src="app.js" defer></script>

    </body>
</html>
